<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI for workspace</title>
<style>
:root{--navy:#1f3a5f;--steel:#4a6f94;--mist:#dfe6ee;--bg:#f4f6f9;--ink:#1d2733;--sub:#5d6b7a;--line:#c9d3de;--warn:#b0503f;--ok:#2c6a3f;
  --l1:#8a6a2e;--l2:#4a6f94;--l3:#2f7a72;--c-HLC:#1f3a5f;--c-DR:var(--l1);--c-DF:var(--l2);--c-EP:var(--l3);--c-O:#1f3a5f;--shade:#eef1f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.serif{font-family:Cambria,Georgia,serif;font-style:italic}
header{background:var(--navy);color:#fff;padding:18px 24px 0}
header .row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
header h1{font:italic 600 26px Cambria,Georgia,serif;margin:0}
header .desc{opacity:.8;font-size:13px;margin-top:2px;max-width:760px}
header .ver{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;flex-wrap:wrap;max-width:100%}
header select{max-width:100%}
header select{font:inherit;padding:4px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.4);background:var(--navy);color:#fff}
nav{display:flex;gap:2px;margin-top:14px;flex-wrap:wrap}
nav button{background:transparent;border:none;color:#fff;opacity:.7;padding:9px 16px;font-size:13.5px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{opacity:1;border-bottom-color:#fff;font-weight:600}
main{padding:22px 24px 60px}
.view{display:none}.view.on{display:block}
.h2{font:italic 20px Cambria,Georgia,serif;color:var(--navy);margin:0 0 10px}
.h3{font:italic 16px Cambria,Georgia,serif;color:var(--navy);margin:22px 0 8px}
.hint{font-size:12.5px;color:var(--sub)}
.card{background:#fff;border-left:4px solid var(--c,var(--steel));padding:12px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,40,70,.06)}
.badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;background:var(--mist);color:var(--steel);white-space:nowrap;margin-right:4px}
.badge.must{background:#e7ecf3;color:var(--navy);font-weight:600}
.badge.neg{background:#f6e3df;color:var(--warn)}
.badge.pos{background:#e3efe6;color:var(--ok)}
.chip{display:inline-flex;font-size:11.5px;padding:2px 9px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--steel);cursor:pointer;user-select:none;margin:0 3px 3px 0}
.chip.off{opacity:.45;text-decoration:line-through}
.chip.tag{cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;padding:6px 12px;font-size:12.5px;color:var(--navy);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--navy);color:#fff}
.link{color:var(--steel);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
/* overview */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:6px 0 4px}
.tile{flex:1;min-width:170px;background:#fff;border-top:4px solid var(--c);padding:12px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(20,40,70,.06)}
.tile:hover{box-shadow:0 3px 10px rgba(20,40,70,.15)}
.tile b{display:block;font:italic 28px Cambria,Georgia,serif;color:var(--navy)}
.tile .t{font:italic 15px Cambria,Georgia,serif;color:var(--navy)}
.tile .cats{margin-top:6px;font-size:11.5px;color:var(--sub);line-height:1.6}
.arrow{display:flex;align-items:center;justify-content:center;width:120px;flex:none;padding:0 6px}
.arrow span{background:var(--c);color:#fff;font-size:11px;font-weight:700;padding:6px 14px 6px 10px;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%);text-align:center;line-height:1.25}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat div{background:#fff;border-left:3px solid var(--c,var(--steel));padding:6px 12px;font-size:11.5px;color:var(--sub)}
.stat b{display:block;font:italic 20px Cambria,Georgia,serif;color:var(--navy)}
/* map */
.mapbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.mapbar input{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:4px;width:200px}
#mapwrap{overflow:auto;background:#fff;border:1px solid var(--mist);border-radius:4px}
#map{position:relative;display:grid;padding:20px 22px 30px;align-items:start;width:max-content}
#wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.colhead{border-left:4px solid var(--c);padding:6px 10px;margin-bottom:10px;font:italic 15px Cambria,Georgia,serif;color:var(--navy);background:#f7f9fb}
.colhead b{font:700 11px sans-serif;color:var(--c);margin-right:6px}
.colhead.next{margin-top:22px}
.box{border:1px solid var(--line);border-radius:6px;padding:6px 7px 0;margin-bottom:10px}
.box>.bl{font-size:11px;color:var(--sub);margin:0 2px 5px}
.node{background:#fff;border:1px solid var(--mist);border-left:4px solid var(--c);border-radius:3px;padding:7px 10px;margin-bottom:7px;cursor:pointer;transition:opacity .12s,box-shadow .12s}
.node:hover{box-shadow:0 2px 8px rgba(20,40,70,.18)}
.node .tt{font-weight:700;color:var(--navy);font-size:12.5px}
.node .tx{font-size:12px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .ids{display:flex;justify-content:space-between;font-size:10px;font-weight:700;margin-top:3px}
.node .ids .dc{color:var(--l2)}.node .ids .pc{color:var(--l3)}
.node.match{box-shadow:0 0 0 2px #e0b84a}
.node.sel{box-shadow:0 0 0 2px var(--steel)}
.dim .node:not(.on){opacity:.22}
.wire{fill:none;stroke-width:1.5;transition:opacity .12s}
.wire.HLC{stroke:#1f3a5f}.wire.DR{stroke:#8a6a2e;stroke-dasharray:5 4}.wire.DF{stroke:#4a6f94}.wire.EP{stroke:#2f7a72;stroke-width:1.2}.wire.neg{stroke:var(--warn)}
.wire.faded{opacity:.07}.wire.hot{stroke-width:2.6}
.hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:22px;border-top:2px solid;vertical-align:middle;margin-right:5px}
/* panel */
aside{position:fixed;top:0;right:-440px;width:420px;max-width:100%;height:100vh;background:#fff;box-shadow:-6px 0 20px rgba(20,40,70,.15);transition:right .2s;z-index:20;display:flex;flex-direction:column}
aside.on{right:0}
aside .ph{padding:14px 18px;border-left:5px solid var(--c,var(--steel));display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--mist)}
aside .ph h3{font:italic 18px Cambria,Georgia,serif;margin:0;color:var(--navy)}
aside .ph button{margin-left:auto;border:none;background:none;font-size:22px;cursor:pointer;color:var(--sub)}
aside .pb{padding:14px 18px 30px;overflow:auto}
.lab{font-size:10.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 4px}
.rel{border-left:3px solid var(--c);background:#f7f9fb;padding:6px 10px;margin-bottom:6px;font-size:12.5px;cursor:pointer}
.rel:hover{background:#eef2f7}
.rel .r{color:var(--sub);font-size:12px;margin-top:2px}
.ev{border-left:3px solid var(--steel);background:#f7f9fb;padding:6px 10px;margin-bottom:6px;font-size:12.5px}
.q{font-size:11px;color:var(--navy);letter-spacing:1px}.q i{font-style:normal;color:var(--line)}
.tri{font-size:12px;color:var(--sub);background:#f4f6f9;border-left:3px solid var(--steel);padding:6px 9px;margin-bottom:6px}
.tri.weak{border-left-color:var(--warn)}
/* conjectures */
.conj{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;align-items:start;background:#fff;padding:12px;margin-bottom:10px;border-left:4px solid var(--l3)}
.conj h4{margin:0 0 6px;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.conj .mid{border-left:1px dashed var(--line);border-right:1px dashed var(--line);padding:0 10px}
@media (max-width:820px){.conj{grid-template-columns:1fr}.conj .mid{border:none;padding:0}.arrow{width:100%;padding:6px 0}}
/* versions */
#vtree{position:relative;overflow:auto;background:#fff;border:1px solid var(--mist);border-radius:4px;padding:10px}
.vcard{position:absolute;width:210px;background:#fff;border:1px solid var(--mist);border-left:4px solid var(--bc);border-radius:3px;padding:8px 11px;cursor:pointer}
.vcard.cur{box-shadow:0 0 0 2px var(--steel)}
.vcard .vn{font-size:11px;font-weight:700;color:var(--navy)}
.vcard .vl{font:italic 14.5px Cambria,Georgia,serif;color:var(--navy)}
.diff div{display:flex;gap:10px;font-size:12.5px;padding:2px 0}
.diff b{width:70px;color:var(--navy)}
.add{color:var(--ok)}.rem{color:var(--warn)}.chg{color:var(--steel)}
footer{font-size:11.5px;color:var(--sub);padding:0 24px 30px}
</style>
</head>

function wires(){

  ls.forEach(l=>{A.set(l.id,[0,0,0,0]);(outs[l.from]=outs[l.from]||[]).push(l);(ins[l.to]=ins[l.to]||[]).push(l);});
  const at=(p,i,k)=>p.y+p.h*(k===1?.5:.15+.7*i/(k-1)), cy=p=>p.y+p.h/2;
  Object.values(outs).forEach(xs=>{xs.sort((a,b)=>cy(pos[a.to])-cy(pos[b.to]));xs.forEach((l,i)=>{const p=pos[l.from],a=A.get(l.id);a[0]=p.x+p.w;a[1]=at(p,i,xs.length);});});
  Object.values(ins).forEach(xs=>{xs.sort((a,b)=>cy(pos[a.from])-cy(pos[b.from]));xs.forEach((l,i)=>{const p=pos[l.to],a=A.get(l.id);a[2]=p.x;a[3]=at(p,i,xs.length);});});
  let h=`<defs>${Object.entries({HLC:'#1f3a5f',DR:'#8a6a2e',DF:'#4a6f94',EP:'#2f7a72',neg:'#b0503f'}).map(([k,c])=>`<marker id="m-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('')}</defs>`;
  ls.forEach(l=>{const f=node(l.from),[x1,y1,x2,y2]=A.get(l.id),neg=NEG.includes(l.status);
    const d=st?`M${x1},${y1} L${x2-2},${y2}`:`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`;
    h+=`<path class="wire ${f.col} ${neg?'neg':''}" data-f="${l.from}" data-t="${l.to}" d="${d}" ${st?`marker-end="url(#m-${neg?'neg':f.col})"`:''}/><path class="hit" data-link="${l.id}" d="${d}"><title>${LT[f.col]}${l.status&&l.status!=='—'?' · '+esc(l.status):''}</title></path>`;});
  svg.innerHTML=h; highlight();
}
function highlight(){
  const m=$('#map'); if(!m) return; const id=sel||hover, set=id&&node(id)?pathSet(id):null;
  m.classList.toggle('dim',!!set);
  m.querySelectorAll('.node').forEach(e=>{e.classList.toggle('on',!!set&&set.has(e.dataset.id));e.classList.toggle('sel',e.dataset.id===sel);});
  m.querySelectorAll('path.wire').forEach(p=>{const on=!!set&&set.has(p.dataset.f)&&set.has(p.dataset.t);p.classList.toggle('hot',on);p.classList.toggle('faded',!!set&&!on);});
}

/* ---------- read-only panel ---------- */
function qDots(q){const L=['Strong','Moderate','Limited','Anecdotal'],i=L.indexOf(q);if(i<0)return '<span class="q"><i>○○○○</i> unrated</span>';return `<span class="q">${'●'.repeat(4-i)}<i>${'○'.repeat(i)}</i> ${esc(q)}</span>`;}
function evHTML(x){return `<div class="ev"><b>${esc(x.cite)}</b><div style="margin:3px 0"><span class="badge ${x.kind==='Primary'?'must':''}">${esc(x.kind)} · ${esc(x.method)}</span><span class="badge">${esc(x.perspective)}</span>${x.applicability==='Indirect'?'<span class="badge">indirect</span>':''}${qDots(x.quality)}</div>${x.who?`<div class="hint">${esc(x.who)}${x.date?' · '+esc(x.date):''}</div>`:''}${x.finding?`<div>${esc(x.finding)}</div>`:''}</div>`;}
function triang(ids){const xs=(ids||[]).map(ev).filter(Boolean); if(!xs.length) return '<div class="tri weak">No evidence linked.</div>';
  const prim=xs.filter(x=>x.kind==='Primary').length, ps=[...new Set(xs.map(x=>x.perspective))], weak=ps.length<2||!prim;
  return `<div class="tri ${weak?'weak':''}"><b>${xs.length}</b> source${xs.length>1?'s':''} · <b>${prim}</b> primary · ${ps.map(esc).join(', ')}${weak?(!prim?' — no primary data':' — single perspective'):' — multiple perspectives'}</div>`;}
function openPanel(title,color,html){$('#ptitle').textContent=title;$('#panel .ph').style.setProperty('--c',color);$('#pbody').innerHTML=html;$('#panel').classList.add('on');$('#pbody').scrollTop=0;}
function closePanel(quiet){$('#panel').classList.remove('on'); if(sel){sel=null; if(!quiet) highlight();}}
function showNode(id){
  const n=node(id); if(!n) return; sel=id; if(tab==='map') highlight();
  const ids=conjIds()[id], f=(SC.cols[n.col]||{}).fields||[];
  const relRow=(l,other,dir)=>`<div class="rel" style="--c:${COLOR[node(l.from).col]}" data-link="${l.id}"><b>${dir==='in'?'← ':'→ '}${esc(other.code)}</b> <span class="hint">${LT[node(l.from).col]}</span> ${stBadge(l.status)}${l.rationale?`<div class="r">${esc(l.rationale)}</div>`:''}</div>`;
  const inn=S.links.filter(l=>l.to===id&&node(l.from)), out=S.links.filter(l=>l.from===id&&node(l.to));
  let h=`<div class="hint">${esc(name(n.col))}${n.cat?' · '+esc(catName(n.col,n.cat)):''}</div><div style="margin:6px 0 2px;font-size:15px">${esc(n.text)}</div>`;
  if(ids&&(ids.dc||ids.pc)) h+=`<div style="margin-top:6px">${ids.dc?`<span class="badge" style="background:#e9eef4;color:var(--l2)">${ids.dc}</span>`:''}${ids.pc?`<span class="badge" style="background:#e6f0ee;color:var(--l3)">${ids.pc}</span>`:''}</div>`;
  f.forEach(([k,label,type])=>{let v=n[k]; if(type==='lit'||v==null||v===''||v==='—'||(Array.isArray(v)&&!v.length)) return; h+=`<div class="lab">${esc(label)}</div><div>${Array.isArray(v)?v.map(x=>`<span class="badge">${esc(x)}</span>`).join(''):esc(v)}</div>`;});
  if(n.lit&&n.lit.length){h+=`<div class="lab">Evidence</div>${triang(n.lit)}${n.lit.map(ev).filter(Boolean).map(evHTML).join('')}`;}
  if(inn.length) h+=`<div class="lab">Comes from</div>`+inn.map(l=>relRow(l,node(l.from),'in')).join('');
  if(out.length) h+=`<div class="lab">Leads to</div>`+out.map(l=>relRow(l,node(l.to),'out')).join('');
  openPanel(n.code,COLOR[n.col],h);
}
function showLink(lid){
  const l=S.links.find(x=>x.id===lid); if(!l) return; const a=node(l.from),b=node(l.to);
  let h=`<div class="rel" style="--c:${COLOR[a.col]}" data-node="${a.id}"><b>${esc(a.code)}</b><div class="r">${esc(a.text)}</div></div><div style="text-align:center;color:var(--sub)">↓</div><div class="rel" style="--c:${COLOR[b.col]}" data-node="${b.id}"><b>${esc(b.code)}</b><div class="r">${esc(b.text)}</div></div>`;
  if(l.status&&l.status!=='—') h+=`<div class="lab">Result</div>${stBadge(l.status)}`;
  if(l.rationale) h+=`<div class="lab">${LT[a.col]==='Constraint'?'How it constrains the feature':LT[a.col]==='Embodiment'?'How the feature embodies it':'Rationale'}</div><div>${esc(l.rationale)}</div>`;
  h+=`<div class="lab">Evidence</div>${triang(l.lit)}${(l.lit||[]).map(ev).filter(Boolean).map(evHTML).join('')}`;
  openPanel(LT[a.col],COLOR[a.col],h);
}
$('#pbody').addEventListener('click',e=>{const r=e.target.closest('[data-link]'); if(r) return showLink(r.dataset.link); const n=e.target.closest('[data-node]'); if(n) showNode(n.dataset.node);});
$('#pclose').onclick=()=>closePanel();
document.addEventListener('keydown',e=>{if(e.key==='Escape') closePanel();});

/* ---------- conjectures ---------- */
function rConj(){
  const ids=conjIds(), ep=of('EP'), bx=boxesOf('EP',ep)||[['',ep]];
  const item=(l,n)=>`<div class="rel" style="--c:${COLOR[n.col]}" data-link="${l.id}"><b>${esc(n.code)}</b> ${stBadge(l.status)}<div class="r">${esc(l.rationale||n.text)}</div></div>`;
  $('#v-conj').innerHTML=`<div class="h2">Design and process conjectures</div><div class="hint" style="margin-bottom:12px">Each enactment process carries one design conjecture (which features should produce it) and one process conjecture (which outcomes it should lead to). Click any row for its rationale and evidence.</div>`+
  bx.map(([lab,ns])=>`${lab?`<div class="h3">${esc(lab)}</div>`:''}`+ns.map(n=>{const x=ids[n.id];
    return `<div class="conj"><div><h4>${x.dc?`${x.dc} ${stBadge(agg(x.inn))}`:'No design conjecture'}</h4>${x.inn.map(l=>item(l,node(l.from))).join('')||'<div class="hint">No features linked</div>'}</div>
    <div class="mid"><h4>Enactment process</h4><div class="rel" style="--c:var(--l3)" data-node="${n.id}"><b>${esc(n.code)}</b> ${stBadge(n.status)}<div class="r">${esc(n.text)}</div></div>${n.indicator?`<div class="hint">Indicator: ${esc(n.indicator)}</div>`:''}</div>
    <div><h4>${x.pc?`${x.pc} ${stBadge(agg(x.out))}`:'No process conjecture'}</h4>${x.out.map(l=>item(l,node(l.to))).join('')||'<div class="hint">No outcomes linked</div>'}</div></div>`;}).join('')).join('');
}
$('#v-conj').addEventListener('click',e=>{const r=e.target.closest('[data-link]'); if(r) return showLink(r.dataset.link); const n=e.target.closest('[data-node]'); if(n) showNode(n.dataset.node);});

/* ---------- evidence ---------- */
function rEvidence(){
  const P=['Participants','SME','Stakeholders','Design team','Published research'];
  const refs=id=>{const r=[];S.nodes.forEach(n=>{if((n.lit||[]).includes(id)) r.push([n.id,n.code]);});S.links.forEach(l=>{if((l.lit||[]).includes(id)){const a=node(l.from),b=node(l.to);if(a&&b) r.push([null,a.code+'→'+b.code,l.id]);}});return r;};
  const groups=[...P,...new Set(S.lit.map(x=>x.perspective).filter(p=>!P.includes(p)))].map(p=>[p,S.lit.filter(x=>x.perspective===p)]).filter(([,xs])=>xs.length);
  $('#v-evidence').innerHTML=`<div class="h2">Evidence</div><div class="stat" style="margin-bottom:8px">${P.map(p=>`<div><b>${S.lit.filter(x=>x.perspective===p).length}</b>${p}</div>`).join('')}<div><b>${S.lit.filter(x=>x.kind==='Primary').length}</b>Primary</div><div><b>${S.lit.filter(x=>x.kind!=='Primary').length}</b>Secondary</div></div>`+
  (groups.map(([p,xs])=>`<div class="h3">${esc(p)} <span class="hint">${xs.length}</span></div>`+xs.map(x=>{const r=refs(x.id);return evHTML(x).replace(/<\/div>$/,`<div style="margin-top:4px">${r.map(([nid,t,lid])=>`<span class="chip" ${nid?`data-node="${nid}"`:`data-link="${lid}"`}>${esc(t)}</span>`).join('')||'<span class="hint">not linked</span>'}</div></div>`);}).join('')).join('')||'<div class="hint">No evidence recorded.</div>');
}
$('#v-evidence').addEventListener('click',e=>{const r=e.target.closest('[data-link]'); if(r) return showLink(r.dataset.link); const n=e.target.closest('[data-node]'); if(n) showNode(n.dataset.node);});

/* ---------- versions ---------- */
function diff(a,b){const rows=[];KEYS.forEach(k=>{const A=new Map(a.nodes.filter(n=>n.col===k).map(n=>[n.id,JSON.stringify({...n,order:0})])),B=new Map(b.nodes.filter(n=>n.col===k).map(n=>[n.id,JSON.stringify({...n,order:0})]));let ad=0,rm=0,ch=0;B.forEach((s,id)=>{if(!A.has(id))ad++;else if(A.get(id)!==s)ch++;});A.forEach((s,id)=>{if(!B.has(id))rm++;});if(ad||rm||ch)rows.push([k,ad,rm,ch]);});
  const cmp=(A,B,label,key)=>{const a=new Map(A.map(x=>[key(x),JSON.stringify(x)])),b=new Map(B.map(x=>[key(x),JSON.stringify(x)]));let ad=0,rm=0,ch=0;b.forEach((s,k)=>{if(!a.has(k))ad++;else if(a.get(k)!==s)ch++;});a.forEach((s,k)=>{if(!b.has(k))rm++;});if(ad||rm||ch)rows.push([label,ad,rm,ch]);};
  cmp(a.links,b.links,'Links',l=>l.from+'>'+l.to); cmp(a.lit||[],b.lit||[],'Evidence',x=>x.id); return rows;}
function rVersions(){
  const vs=DATA.versions, kids={}; vs.forEach(v=>(kids[v.parent||'_']=kids[v.parent||'_']||[]).push(v));
  const pos={}; let row=0,maxX=0; const place=(v,d)=>{pos[v.id]={x:d,y:row};maxX=Math.max(maxX,d);(kids[v.id]||[]).forEach((c,i)=>{if(i)row++;place(c,d+1);});};
  (kids._||[]).forEach((r,i)=>{if(i)row++;place(r,0);});
  (vs.filter(v=>!pos[v.id])).forEach(v=>{row++;place(v,0);});
  const CW=250,RH=120,BC=['#1f3a5f','#4a6f94','#8a99ad'],br=[...new Set(vs.map(v=>v.branch))],bc=b=>BC[br.indexOf(b)%3];
  const edges=vs.filter(v=>v.parent&&pos[v.parent]).map(v=>{const a=pos[v.parent],b=pos[v.id],x1=a.x*CW+220,y1=a.y*RH+40,x2=b.x*CW+10,y2=b.y*RH+40;return `<path d="M${x1},${y1} C${x1+30},${y1} ${x2-30},${y2} ${x2},${y2}" stroke="${bc(v.branch)}" stroke-width="2" fill="none"/>`;}).join('');
  const par=V.parent&&vs.find(v=>v.id===V.parent), df=par?diff(par.data,V.data):null;
  $('#v-versions').innerHTML=`<div class="h2">Design iterations</div><div class="hint" style="margin-bottom:10px">Each version builds on its parent; parallel branches are alternative directions. Click a version to view it.</div>
  <div id="vtree"><div style="position:relative;width:${(maxX+1)*CW+20}px;height:${(row+1)*RH+10}px"><svg width="${(maxX+1)*CW+20}" height="${(row+1)*RH}" style="position:absolute;left:0;top:0">${edges}</svg>
  ${vs.map(v=>{const p=pos[v.id];return `<div class="vcard ${v.id===V.id?'cur':''}" data-v="${v.id}" style="left:${p.x*CW+10}px;top:${p.y*RH+10}px;--bc:${bc(v.branch)}"><div class="vn">v${v.n} · ${esc(v.branch)}${v.id===DATA.head?' · latest':''}</div><div class="vl">${esc(v.label)}</div><div>${(v.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div></div>`;}).join('')}</div></div>
  <div class="h3">v${V.n} · ${esc(V.label)}</div><div class="card">${V.note?`<div>${esc(V.note)}</div>`:'<div class="hint">No note for this version.</div>'}
  ${df?`<div class="lab">Changes since v${par.n}</div><div class="diff">${df.length?df.map(([k,a,r,c])=>`<div><b>${k}</b><span class="add">+${a}</span><span class="rem">−${r}</span><span class="chg">~${c} edited</span></div>`).join(''):'<div class="hint">No changes.</div>'}</div>`:''}</div>`;
}
$('#v-versions').addEventListener('click',e=>{const c=e.target.closest('[data-v]'); if(c) setVersion(c.dataset.v);});

$('#v-overview').addEventListener('click',e=>{const t=e.target.closest('[data-go]'); if(t){layer=t.dataset.go; setTab('map');}});

});
